name: CI Continuous Integration

on:
  push:
    branches:
      - main
      - dev
      - "fix/**"
      - "feat/**"
  pull_request:
    branches:
      - main
      - dev

jobs:
  code-quality:
    name: Code Quality & Zero-Emoji Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax & Lint Checks
        run: |
          node -c server/index.js
          node -c core/pet.js
          node -c core/settings.js
          node -e "JSON.parse(require('fs').readFileSync('package.json'))"
          node -e "JSON.parse(require('fs').readFileSync('plugin.json'))"
          node scripts/audit_zero_emojis.js

  rust-check:
    name: Rust Compilation Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Cargo Check
        run: |
          cargo check --manifest-path desktop/Cargo.toml
