name: Release Multi-Platform Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. Mac-Arm (Apple Silicon M1/M2/M3/M4)
          - os: macos-latest
            target: aarch64-apple-darwin
            arch_name: macOS-arm64
            archive_type: tar.gz
            binary_name: anti-pet-desktop

          # 2. Win-x64 (主流 64 位 Windows)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch_name: windows-x64
            archive_type: zip
            binary_name: anti-pet-desktop.exe

          # 3. Win-Arm (Windows on ARM)
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            arch_name: windows-arm64
            archive_type: zip
            binary_name: anti-pet-desktop.exe

          # 4. Linux-x64 (Ubuntu / Debian / Fedora)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch_name: linux-x64
            archive_type: tar.gz
            binary_name: anti-pet-desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies (Pure CPU 2D — no WebKit2GTK required)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Build Pure CPU 2D release binary
        run: |
          cargo build --release --manifest-path desktop/Cargo.toml --features cpu-2d --target ${{ matrix.target }}

      - name: Assemble portable package (Unix)
        if: matrix.archive_type == 'tar.gz'
        run: |
          PKG="Anti-Pet-${{ github.ref_name }}-${{ matrix.arch_name }}"
          mkdir -p "bundle/$PKG"
          cp "desktop/target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "bundle/$PKG/"
          cp -r skins "bundle/$PKG/"
          [ -d hooks ] && cp -r hooks "bundle/$PKG/" || true
          [ -f hooks.json ] && cp hooks.json "bundle/$PKG/" || true
          [ -f plugin.json ] && cp plugin.json "bundle/$PKG/" || true
          cp README.md LICENSE "bundle/$PKG/"

          # Assemble native macOS Anti-Pet.app bundle
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            chmod +x scripts/build_macos_app.sh
            ./scripts/build_macos_app.sh "desktop/target/${{ matrix.target }}/release/anti-pet-desktop"
            cp -r dist/Anti-Pet.app "bundle/$PKG/"
          fi

          tar -czf "$PKG.tar.gz" -C bundle "$PKG"

      - name: Assemble portable package (Windows)
        if: matrix.archive_type == 'zip'
        shell: pwsh
        run: |
          $Pkg = "Anti-Pet-${{ github.ref_name }}-${{ matrix.arch_name }}"
          New-Item -ItemType Directory -Force -Path "bundle/$Pkg"
          Copy-Item "desktop/target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -Destination "bundle/$Pkg/"
          Copy-Item -Recurse "skins" -Destination "bundle/$Pkg/"
          if (Test-Path "hooks") { Copy-Item -Recurse "hooks" -Destination "bundle/$Pkg/" }
          if (Test-Path "hooks.json") { Copy-Item "hooks.json" -Destination "bundle/$Pkg/" }
          if (Test-Path "plugin.json") { Copy-Item "plugin.json" -Destination "bundle/$Pkg/" }
          Copy-Item "README.md", "LICENSE" -Destination "bundle/$Pkg/"
          Compress-Archive -Path "bundle/$Pkg" -DestinationPath "$Pkg.zip"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            Anti-Pet-${{ github.ref_name }}-${{ matrix.arch_name }}.${{ matrix.archive_type }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
