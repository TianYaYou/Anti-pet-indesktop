[package]
name = "anti-pet-desktop"
version = "0.3.0"
edition = "2021"

[features]
default = ["cpu-2d"]
# Pure CPU 2D software rendering engine (zero WebKit, zero Node.js runtime)
cpu-2d = []
# Legacy WebKit + Node.js engine kept for fallback comparison
legacy-webkit = ["dep:wry"]


[dependencies]
dirs = "7.0"
fastrand = "2.5"
muda = "0.21"
png = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tao = "0.37"
tray-icon = "0.26"
wry = { version = "0.57", optional = true }



[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
]

[target.'cfg(target_os = "linux")'.dependencies]
cairo-rs = "0.18"
gdk = "0.18"
gtk = "0.18"
pango = "0.18"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
