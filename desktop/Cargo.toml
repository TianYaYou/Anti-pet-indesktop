[package]
name = "anti-pet-desktop"
version = "0.2.0"
edition = "2021"

[dependencies]
muda = "0.21"
tao = "0.37"
tray-icon = "0.26"
wry = "0.57"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
]
