<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大肥猫 · Antigravity 桌宠</title>
  <link rel="stylesheet" href="/core/pet.css">
</head>
<body class="pet-body">
  <!-- Floating DND Wake Pill -->
  <div id="dnd-wake-pill" class="dnd-wake-pill hidden" title="点击或按 Cmd/Ctrl+Shift+P 唤醒大肥猫">
    <span class="wake-text">穿透免打扰中 · 点击唤醒</span>
  </div>

  <div id="pet-container" class="pet-container facing-left state-idle">
    <!-- Speech / Quota Bubble -->
    <div id="speech-bubble" class="speech-bubble hidden">
      <div class="bubble-content">
        <div id="bubble-text" class="bubble-text">喵~ 今天也要认真写代码哦！</div>

        <!-- Quota Section (Synced directly with Antigravity Language Server) -->
        <div id="quota-section" class="quota-section">
          <div class="quota-bar-row">
            <span class="quota-label">5h 额度</span>
            <div class="quota-bar-track">
              <div id="quota-5h" class="quota-bar-fill" style="width: 95%;"></div>
            </div>
            <span id="quota-5h-val" class="quota-percent">95%</span>
          </div>
          <div class="quota-bar-row">
            <span class="quota-label">周 额度</span>
            <div class="quota-bar-track">
              <div id="quota-week" class="quota-bar-fill week" style="width: 77%;"></div>
            </div>
            <span id="quota-week-val" class="quota-percent">77%</span>
          </div>
          <div id="quota-meta" class="quota-meta">正在同步 Antigravity 实时额度...</div>
        </div>
      </div>
      <div class="bubble-tail"></div>
    </div>

    <!-- Pet Sprite Presentation (Zero bottom padding/badge so it sits 100% flush with screen/Dock edge) -->
    <div id="sprite-wrapper" class="sprite-wrapper">
      <img
        id="pet-frame"
        class="pet-frame"
        src="/skins/fat-cat/frames/idle.png"
        alt="大肥猫"
        width="136"
        style="width: 136px; max-width: 136px; height: auto;"
        draggable="false"
        crossorigin="anonymous"
      >
    </div>
  </div>

  <!-- Right-Click Context Menu (Clean text, no emojis) -->
  <div id="context-menu" class="context-menu hidden">
    <div class="menu-header">大肥猫 · 伴侣控制台</div>
    <div class="menu-item" data-action="toggle-quota">切换额度卡片</div>
    <div class="menu-item" data-action="random-dialogue">换一句傲娇台词</div>
    <div class="menu-item" data-action="pet-action">揉头摸摸大肥猫</div>
    <div class="menu-divider"></div>
    <div class="menu-item" data-action="toggle-floor-mode">落点模式: <span id="floor-mode-status">自动贴合</span></div>
    <div class="menu-item" data-action="toggle-dnd">完全穿透 (免打扰): <span id="dnd-status">关闭</span></div>
    <div class="menu-item" data-action="toggle-ide-only">仅 IDE 活跃时显示: <span id="ide-only-status">关闭</span></div>
    <div class="menu-item" data-action="toggle-gravity">重力下落吸附: <span id="gravity-status">开启</span></div>
    <div class="menu-divider"></div>
    <div class="menu-item" data-action="switch-skin">切换皮肤 (<span id="skin-status">大肥猫</span>)</div>
    <div class="menu-item" data-action="toggle-sound">音效: <span id="sound-status">开启</span></div>
    <div class="menu-divider"></div>
    <div class="menu-item close" data-action="close-menu">关闭菜单 (Cmd/Ctrl+Shift+P)</div>
  </div>

  <!-- Core Scripts -->
  <script src="/core/bridge.js"></script>
  <script src="/core/pet.js"></script>
</body>
</html>
