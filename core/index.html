<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大肥猫 · Antigravity 桌宠</title>
  <link rel="stylesheet" href="/core/pet.css">
</head>
<body class="pet-body">
  <!-- Floating DND Wake Pill -->
  <div id="dnd-wake-pill" class="dnd-wake-pill hidden" title="点击或按 Cmd/Ctrl+Shift+P 唤醒大肥猫">
    <span class="wake-text">穿透免打扰中 · 点击唤醒</span>
  </div>

  <div id="pet-container" class="pet-container facing-left state-idle">
    <!-- Cat Thought Cloud Bubble (o -> O -> Cloud Bubble) -->
    <div id="speech-bubble" class="speech-bubble hidden">
      <div id="bubble-cloud" class="bubble-content">
        <div id="bubble-text" class="bubble-text">喵~ 今天也要认真写代码哦！</div>

        <!-- Quota Section (Synced with Antigravity Language Server) -->
        <div id="quota-section" class="quota-section">
          <div class="quota-bar-row">
            <span class="quota-label">5h 额度</span>
            <div class="quota-bar-track">
              <div id="quota-5h" class="quota-bar-fill" style="width: 95%;"></div>
            </div>
            <span id="quota-5h-val" class="quota-percent">95%</span>
          </div>
          <div class="quota-bar-row">
            <span class="quota-label">周 额度</span>
            <div class="quota-bar-track">
              <div id="quota-week" class="quota-bar-fill week" style="width: 77%;"></div>
            </div>
            <span id="quota-week-val" class="quota-percent">77%</span>
          </div>
          <div id="quota-meta" class="quota-meta">正在同步 Antigravity 实时额度...</div>
        </div>
      </div>

      <!-- Thought Trail Dots rising from cat's head (o -> O) -->
      <div class="thought-trail" aria-hidden="true">
        <span class="thought-dot thought-dot-lg"></span>
        <span class="thought-dot thought-dot-sm"></span>
      </div>
    </div>

    <!-- Floating Zoom Scale Pill -->
    <div id="zoom-pill" class="zoom-pill hidden">🐾 100%</div>

    <!-- Pet Sprite Presentation -->
    <div id="sprite-wrapper" class="sprite-wrapper">
      <img
        id="pet-frame"
        class="pet-frame"
        src="/skins/fat-cat/frames/idle.png"
        alt="大肥猫"
        width="136"
        style="width: 100%; max-width: 100%; height: auto;"
        draggable="false"
        crossorigin="anonymous"
      >
    </div>
  </div>

  <!-- Right-Click Context Menu -->
  <div id="context-menu" class="context-menu hidden">
    <div class="menu-header">大肥猫 · 伴侣控制台</div>
    <div class="menu-item" data-action="toggle-quota"><span>切换额度卡片</span></div>
    <div class="menu-item" data-action="random-dialogue"><span>换一句傲娇台词</span></div>
    <div class="menu-item" data-action="pet-action"><span>揉头摸摸大肥猫</span></div>
    <div class="menu-item" data-action="reset-zoom"><span>缩放大小 (滚轮微调)</span><span id="zoom-status" class="menu-val">100%</span></div>
    <div class="menu-divider"></div>
    <div class="menu-item" data-action="toggle-floor-mode"><span>落点模式</span><span id="floor-mode-status" class="menu-val">自动贴合</span></div>
    <div class="menu-item" data-action="toggle-dnd"><span>完全穿透 (免打扰)</span><span id="dnd-status" class="menu-val">关闭</span></div>
    <div class="menu-item" data-action="toggle-ide-only"><span>仅 IDE 活跃时显示</span><span id="ide-only-status" class="menu-val">关闭</span></div>
    <div class="menu-item" data-action="toggle-gravity"><span>重力下落吸附</span><span id="gravity-status" class="menu-val">开启</span></div>
    <div class="menu-divider"></div>
    <div class="menu-item" data-action="switch-skin"><span>切换皮肤</span><span id="skin-status" class="menu-val">大肥猫</span></div>
    <div class="menu-item" data-action="toggle-sound"><span>音效</span><span id="sound-status" class="menu-val">开启</span></div>
    <div class="menu-divider"></div>
    <div class="menu-item close" data-action="close-menu"><span>关闭菜单 (Cmd/Ctrl+Shift+P)</span></div>
  </div>

  <!-- Core Scripts -->
  <script src="/core/bridge.js"></script>
  <script src="/core/pet.js"></script>
</body>
</html>
